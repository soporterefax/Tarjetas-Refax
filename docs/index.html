<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | REFAX</title><link rel="icon" href="assets/img/refax-logo.png"><link rel="stylesheet" href="assets/css/app.css"></head>
<body class="login-page"><div class="login-card"><img src="assets/img/refax-logo.png" class="logo" alt="REFAX"><div class="subtitle">Tarjetas digitales corporativas</div><div id="msg" class="message error"></div><form id="loginForm"><input id="username" type="text" placeholder="Usuario" autocomplete="username" required><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required><button class="btn btn-primary" type="submit">Ingresar</button></form><div class="footer">REFAX Perú · Acceso seguro</div></div>
<script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script>
if(getToken()){ window.location.href = getRole()==="admin" ? "admin.html" : "usuario.html"; }
const form=document.getElementById('loginForm'), msg=document.getElementById('msg');
form.addEventListener('submit', async e=>{e.preventDefault();msg.className='message error';msg.textContent='';try{const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});localStorage.setItem('refax_token',data.token);localStorage.setItem('refax_role',data.rol);localStorage.setItem('refax_username',data.username);window.location.href=data.rol==='admin'?'admin.html':'usuario.html';}catch(err){msg.textContent=err.message;msg.classList.add('show');}});
</script></body></html>
