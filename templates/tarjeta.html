<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarjeta de {{ usuario.nombre }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="card-page">
    <main class="digital-card" aria-label="Tarjeta digital">
        <header class="card-logo">
            <img src="{{ url_for('static', filename='img/refax-logo.png') }}" alt="REFAX" class="logo">
        </header>

        <section class="identity">
            <h1>{{ usuario.nombre }}</h1>
            <p>{{ usuario.cargo }}</p>
        </section>

        <section class="contact-list">
            <p><strong>Empresa:</strong> {{ usuario.empresa }}</p>
            <p><strong>Celular:</strong> <a href="tel:{{ usuario.celular }}">{{ usuario.celular }}</a></p>
            <p><strong>Correo:</strong> <a href="mailto:{{ usuario.correo }}">{{ usuario.correo }}</a></p>
            <p><strong>Web:</strong> <a href="{{ usuario.web }}" target="_blank" rel="noopener">{{ usuario.web }}</a></p>
        </section>
    </main>
</body>
</html>
