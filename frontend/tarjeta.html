<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjeta digital | REFAX</title><link rel="stylesheet" href="assets/css/app.css"></head>
<body class="card-page"><main id="card" class="digital-card"><div class="loading">Cargando tarjeta...</div></main>
<script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script>
const id=new URLSearchParams(location.search).get('id');
const OFICINA='Av. Canaval y Moreyra № 480 Of. 701 - B – San Isidro';
const CENTRAL='(051) 1 453-1000';
const CALL_CENTER='983455378 - 983563193 - 955155107 - 977838054 - 913735869 - 970704609 - 983582710 - 942122263 - 965722676';
load();
async function load(){if(!id){card.innerHTML='<div class="message error show">Tarjeta no válida.</div>';return}try{const u=await api(`/api/tarjeta/${encodeURIComponent(id)}`);document.title=`Tarjeta de ${u.nombre}`;card.className=`digital-card card-${slug(u.tipo_usuario||'Administrativo')}`;card.innerHTML=renderCard(u)}catch(e){card.innerHTML=`<div class="message error show">${esc(e.message)}</div>`}}
function header(){return '<header class="card-logo"><img src="assets/img/refax-logo.png" alt="REFAX" class="logo"></header>'}
function brands(){return '<div class="brands-wrap"><img src="assets/img/marcas-refax.png" class="brands-img" alt="Marcas representadas"></div>'}
function renderCard(u){
 const t=u.tipo_usuario||'Administrativo';
 if(t==='GNs')return `${header()}<section class="identity"><h1>${esc(u.nombre)}</h1><span class="type-badge type-gns">GNs</span></section><section class="contact-list"><p><strong>Celular:</strong> <a href="tel:${attr(u.celular)}">${esc(u.celular)}</a></p><p><strong>Correo:</strong> <a href="mailto:${attr(u.correo)}">${esc(u.correo)}</a></p><p><strong>Call Center:</strong> ${esc(CALL_CENTER)}</p><p><strong>Oficina:</strong> ${esc(OFICINA)}</p></section>${brands()}`;
 if(t==='B2B')return `${header()}<section class="identity"><h1>${esc(u.nombre)}</h1><p>Ejecutivo Web</p></section><section class="contact-list"><p><strong>Celular:</strong> <a href="tel:${attr(u.celular)}">${esc(u.celular)}</a></p><p><strong>Atención web:</strong> ${esc(u.atencion_web||'')}</p><p><strong>Central:</strong> ${esc(CENTRAL)}</p><p><strong>Oficina:</strong> ${esc(OFICINA)}</p></section><div class="b2b-tagline">E-commerce Refax, el mundo de repuestos a tu alcance</div>`;
 return `${header()}<section class="identity"><h1>${esc(u.nombre)}</h1><p>${esc(u.cargo)}</p></section><section class="contact-list"><p><strong>Celular:</strong> <a href="tel:${attr(u.celular)}">${esc(u.celular)}</a></p><p><strong>Central:</strong> ${esc(CENTRAL)}</p><p><strong>Oficina:</strong> ${esc(OFICINA)}</p><p><strong>Correo:</strong> <a href="mailto:${attr(u.correo)}">${esc(u.correo)}</a></p></section>${brands()}<div class="website-fixed"><a href="https://www.refax.com/peru" target="_blank" rel="noopener">https://www.refax.com/peru</a></div>`;
}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v=''){return esc(v)}function slug(v=''){return String(v).toLowerCase().replace(/[^a-z0-9]/g,'')}
</script></body></html>
